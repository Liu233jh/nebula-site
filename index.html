<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA · 选择版本</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  background:radial-gradient(1100px 700px at 78% -12%,rgba(30,90,200,.28),transparent 62%),
             radial-gradient(900px 620px at 12% 108%,rgba(10,60,140,.22),transparent 60%),
             linear-gradient(160deg,#050D1F,#0A1B3E 70%);
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;padding:40px 20px;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:30px;max-width:880px;width:100%}
mark{background:none;color:#4DA3FF;font-size:12px;letter-spacing:.42em;opacity:0;animation:fin .8s .15s forwards}
h1{font-size:clamp(28px,5.4vw,50px);margin:0;font-weight:800;letter-spacing:.02em;text-align:center}
h1 span{display:inline-block;opacity:0;transform:translateY(14px);animation:drop .6s cubic-bezier(.22,1,.36,1) forwards}
h1 i{font-style:normal;color:#4DA3FF}
.vs{display:grid;grid-template-columns:repeat(2,minmax(260px,400px));gap:22px;width:100%;justify-content:center}
.card{position:relative;display:block;padding:26px 28px 22px;border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;
  background:rgba(255,255,255,.045);backdrop-filter:blur(6px);overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .35s}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(77,163,255,.14) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.card:hover::before{transform:translateX(120%)}
.card:hover{border-color:#4DA3FF;transform:translateY(-5px);box-shadow:0 18px 44px -12px rgba(10,102,255,.45)}
.cno{font-size:11px;letter-spacing:.34em;color:rgba(255,255,255,.5)}
.cno b{color:#4DA3FF;font-weight:700}
.card h2{margin:12px 0 6px;font-size:22px;letter-spacing:.06em}
.cen{font-size:10px;letter-spacing:.3em;color:#4DA3FF;opacity:.9}
.cdesc{margin:12px 0 16px;font-size:12px;line-height:1.8;color:rgba(255,255,255,.62)}
.ctags{display:flex;gap:7px;flex-wrap:wrap}
.ctags span{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;transition:border-color .3s,color .3s}
.card:hover .ctags span{border-color:rgba(77,163,255,.6);color:#9cc8ff}
.cgo{margin-top:16px;font-size:11px;letter-spacing:.24em;color:#4DA3FF;display:inline-flex;align-items:center;gap:8px}
.cgo::after{content:'→';transition:transform .3s}
.card:hover .cgo::after{transform:translateX(5px)}
p{color:rgba(255,255,255,.42);font-size:11px;letter-spacing:.15em;margin:6px 0 0;text-align:center;opacity:0;animation:fin .8s 1.15s forwards}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes fin{to{opacity:1}}
@media(max-width:640px){
  .vs{grid-template-columns:minmax(0,1fr)}
  body{gap:24px;padding:32px 16px}
}
@media(prefers-reduced-motion:reduce){
  mark,h1 span,p{animation:none;opacity:1;transform:none}
  .card,.card::before,.card .cgo::after,.card .ctags span{transition:none}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
<mark>NEBULA · 双版本</mark>
<h1 id="tt">选一个 <i>人物动效</i></h1>
<div class="vs">
  <a class="card" href="./a/">
    <span class="cno"><b>01</b> / VERSION A</span>
    <h2>A · 阻尼版</h2>
    <span class="cen">DAMPED PARALLAX</span>
    <p class="cdesc">整幅人物呼吸与阻尼视差——风穿过画面时，所有层以不同延迟追随，安静、克制。</p>
    <div class="ctags"><span>阻尼跟随</span><span>整图呼吸</span><span>低噪声</span></div>
    <span class="cgo">进入 A 版</span>
  </a>
  <a class="card" href="./b/">
    <span class="cno"><b>02</b> / VERSION B</span>
    <h2>B · 木偶版</h2>
    <span class="cen">FIVE-SPRING PUPPET</span>
    <p class="cdesc">五弹簧木偶物理——左右发束、刘海、马尾各挂一根弹簧，风一吹，头发自己找到回家的路。</p>
    <div class="ctags"><span>五弹簧</span><span>分层摆动</span><span>风吹发梢</span></div>
    <span class="cgo">进入 B 版</span>
  </a>
</div>
<p>两版内容一致，仅人物动效不同 · 虚构演示，非真实服务</p>
</div>
<script>
(function(){
  var reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var c=document.getElementById('sky');
  if(reduced||!c){if(c)c.parentNode.removeChild(c);return}
  var ctx=c.getContext('2d'),stars=[],meteors=[],W,H;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.4+Math.random()*1.2});
  function meteor(){
    var x=Math.random()*W*.8+W*.1;
    meteors.push({x:x,y:Math.random()*H*.25,vx:4+Math.random()*3,vy:2.2+Math.random()*1.4,life:1});
    setTimeout(meteor,3800+Math.random()*6500);
  }
  setTimeout(meteor,1600);
  var t=0;
  (function frame(){
    t+=.016;ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];
      var a=.35+.45*Math.abs(Math.sin(t*s.s+s.p));
      ctx.globalAlpha=a;ctx.fillStyle='#cfe4ff';
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill();
    }
    for(var j=meteors.length-1;j>=0;j--){var m=meteors[j];
      m.x+=m.vx;m.y+=m.vy;m.life-=.012;
      if(m.life<=0){meteors.splice(j,1);continue}
      var g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*9,m.y-m.vy*9);
      g.addColorStop(0,'rgba(140,190,255,'+(.85*m.life)+')');g.addColorStop(1,'rgba(140,190,255,0)');
      ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*9,m.y-m.vy*9);ctx.stroke();
    }
    requestAnimationFrame(frame);
  })();
})();
(function(){
  var h=document.getElementById('tt');if(!h)return;
  var html=h.innerHTML,out='',step=0;
  for(var i=0;i<html.length;i++){
    if(html[i]==='<'){out+=html.slice(i,html.indexOf('>',i)+1);i=html.indexOf('>',i);continue}
    var d=step===0?'.18s':'.'+(0.28+step*0.07)+'s';
    out+='<span style="animation-delay:'+d+'">'+html[i]+'</span>';step++;
  }
  h.innerHTML=out;
})();
</script>
</body>
</html>
