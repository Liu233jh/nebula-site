name: sync-site

on:
  push:
    paths:
      - 'fetched/urls.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch site files
        run: |
          set -e
          A=$(jq -r .a fetched/urls.json)
          B=$(jq -r .b fetched/urls.json)
          curl -fsSL "$A" -o a/index.html
          curl -fsSL "$B" -o b/index.html
          ls -la a b

      - name: commit
        run: |
          git config user.name "nebula-bot"
          git config user.email "bot@users.noreply.github.com"
          git add a/index.html b/index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "sync: pull site build from CDN $(date -u +%FT%TZ)"
          git push
